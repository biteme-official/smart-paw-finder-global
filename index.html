    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H7171JQ75N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Shopify 결제 후 복귀 시 referrer가 Shopify 도메인이면
      // GA4가 새 세션/새 사용자 소스로 덮어쓰지 않도록 ignore_referrer 설정
      var shopifyReferrer = document.referrer && (
        document.referrer.indexOf('myshopify.com') !== -1 ||
        document.referrer.indexOf('shopify.com') !== -1 ||
        document.referrer.indexOf('checkout.shopify.com') !== -1
      );

      var ga4Config = {
        'send_page_view': true,
        'page_location': window.location.href,
        'page_title': document.title,
        'linker': {
          'domains': ['biteme.one', 'lovable-project-lbgum.myshopify.com', 'biteme.co.jp', 'biteme-jp.myshopify.com'],
          'accept_incoming': true
        }
      };

      // 결제 복귀 시 소스 보존: Shopify referrer 무시
      if (shopifyReferrer) {
        ga4Config.ignore_referrer = true;
      }

      gtag('config', 'G-H7171JQ75N', ga4Config);
    </script>
