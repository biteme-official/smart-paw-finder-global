name: Vercel Preview — admin-manage

on:
  pull_request:
    branches: [admin-manage]
    paths: [admin-manage/**]

concurrency:
  group: vercel-preview-admin-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-manage/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: admin-manage

      - name: Build
        run: npm run build
        working-directory: admin-manage

      - name: Deploy to Vercel
        id: deploy
        working-directory: admin-manage
        run: |
          npm i -g vercel
          PREVIEW_URL=$(vercel deploy --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }})
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_MANAGE_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## Vercel Preview — admin-manage',
                '',
                `✅ **Preview URL:** ${{ steps.deploy.outputs.url }}`,
                '',
                '> 행동 분석 탭에서 GA4 연동 결과를 확인하세요.',
              ].join('\n')
            })
