name: Slack PR Merge Notify

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      !contains(fromJSON('["bmhayoung"]'), github.event.pull_request.user.login)
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
        run: |
          REPO="${{ github.event.repository.name }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          MERGED_BY="${{ github.event.pull_request.merged_by.login }}"
          PR_URL="${{ github.event.pull_request.html_url }}"

          PAYLOAD=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "#DC3545",
                "blocks": [
                  {
                    "type": "section",
                    "text": { "type": "mrkdwn", "text": "*✅ 머지 완료 — ${REPO} #${PR_NUMBER}*\n${PR_TITLE}" }
                  },
                  {
                    "type": "context",
                    "elements": [
                      { "type": "mrkdwn", "text": "👤 @${PR_AUTHOR} → merged by @${MERGED_BY}  |  <${PR_URL}|PR 보기>" }
                    ]
                  }
                ]
              }
            ]
          }
          EOF
          )

          curl -s -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$SLACK_WEBHOOK_URL"
